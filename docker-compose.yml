services:
  db:
    image: postgres:16-alpine
    container_name: football-club-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: club
      POSTGRES_PASSWORD: clubpass
      POSTGRES_DB: footballclub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
